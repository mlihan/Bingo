<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Azuki's Bingo Party</title>

  <style>
    :root{
      --bg0:#070915;
      --bg1:#0b1230;
      --glass: rgba(255,255,255,.06);
      --glass2: rgba(255,255,255,.035);
      --stroke: rgba(255,255,255,.12);
      --stroke2: rgba(255,255,255,.08);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);

      --accentA:#00ffd1;
      --accentB:#7c5cff;
      --accentC:#2a7cff;

      --calledBg: rgba(0,255,209,.92);
      --calledText: #072117;

      --shadowSoft: 0 10px 26px rgba(0,0,0,.25);
      --radiusXL: 26px;
      --radiusL: 18px;
      --radiusM: 12px;

      /* tighter spacing for TVs */
      --pagePad: 12px;
      --gap: 12px;
      --pad: 14px;
      --gridGap: 7px;
    }

    *{ box-sizing: border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      overflow:hidden;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1000px 700px at 20% 25%, rgba(124,92,255,.20), transparent 60%),
        radial-gradient(900px 650px at 75% 35%, rgba(0,255,209,.18), transparent 55%),
        radial-gradient(1100px 900px at 60% 90%, rgba(42,124,255,.18), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.18;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.22) 0 1px, transparent 2px),
        radial-gradient(circle at 55% 40%, rgba(255,255,255,.16) 0 1px, transparent 2px),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,.18) 0 1px, transparent 2px),
        radial-gradient(circle at 30% 80%, rgba(255,255,255,.12) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 75%, rgba(255,255,255,.14) 0 1px, transparent 2px);
      background-size: 420px 420px;
      filter: blur(.2px);
    }

    .app{
      height:100vh;
      display:flex;
      padding: var(--pagePad);
      gap: var(--gap);
    }

    .col{
      width:50%;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap: var(--gap);
    }

    .panel{
      background: linear-gradient(180deg, var(--glass), var(--glass2));
      border: 1px solid var(--stroke);
      border-radius: var(--radiusXL);
      box-shadow: var(--shadowSoft);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow:hidden;
      position: relative;
    }

    .panel::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius: var(--radiusXL);
      pointer-events:none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
    }

    /* Top header: title + buttons (top-right) */
    .topBar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 10px 12px;
    }

    .partyTitle{
      font-weight: 950;
      letter-spacing: .01em;
      font-size: clamp(14px, 2vw, 20px);
      line-height: 1.2;
      user-select:none;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 55%;
    }

    .btnRow{
      display:flex;
      gap: 8px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap: wrap;
    }

    .btn{
      border: none;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 950;
      font-size: 14px;
      cursor: pointer;
      color: white;
      user-select:none;
      position: relative;
      overflow:hidden;
      transform: translateZ(0);
      line-height: 1;
    }

    .btn::after{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(600px 180px at 20% 0%, rgba(255,255,255,.25), transparent 55%);
      opacity:.55;
      transform: translateY(-22px);
      transition: transform .18s ease;
      pointer-events:none;
    }
    .btn:hover::after{ transform: translateY(-10px); }
    .btn:active{ transform: translateY(1px); }
    .btn:disabled{
      cursor:not-allowed;
      opacity:.55;
      transform:none;
    }

    .nextBtn{
      background:
        radial-gradient(120% 140% at 20% 10%, rgba(255,255,255,.20), transparent 45%),
        linear-gradient(135deg, var(--accentC), var(--accentB));
      box-shadow: 0 14px 30px rgba(124,92,255,.18);
    }

    .resetBtn{
      background:
        radial-gradient(120% 140% at 20% 10%, rgba(255,255,255,.15), transparent 45%),
        linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 12px 26px rgba(0,0,0,.18);
    }

    .bingoBtn{
      background:
        radial-gradient(120% 140% at 20% 10%, rgba(255,255,255,.20), transparent 45%),
        linear-gradient(135deg, rgba(0,255,209,.95), rgba(42,124,255,.70));
      color: #062019;
      box-shadow: 0 16px 34px rgba(0,255,209,.18);
    }

    /* LEFT */
    .latestPanel{
      flex: 1;
      min-height:0;
      display:flex;
      flex-direction:column;
    }

    .latestBody{
      flex:1;
      min-height:0;
      padding: var(--pad);
      display:flex;
    }

    .latestBox{
      flex:1;
      border-radius: calc(var(--radiusXL) - 6px);
      border: 1px solid var(--stroke2);
      background:
        radial-gradient(1200px 700px at 30% 20%, rgba(0,255,209,.14), transparent 55%),
        radial-gradient(900px 650px at 70% 80%, rgba(124,92,255,.12), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding: 12px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
      user-select:none;
    }

    .latestNumber{
      font-weight: 980;
      letter-spacing: .01em;
      line-height: .95;
      font-size: clamp(68px, 12vw, 210px);
      text-shadow: 0 18px 45px rgba(0,0,0,.45);
    }

    .latestSub{
      margin-top: 10px;
      font-weight: 750;
      color: var(--muted);
      letter-spacing: .03em;
      font-size: clamp(12px, 1.8vw, 18px);
      line-height: 1.25;
    }

    .historyPanel{
      padding: 10px 12px 12px;
    }

    .titleRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 8px;
      gap: 10px;
    }

    .title{
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 11px;
      color: rgba(255,255,255,.70);
      user-select:none;
    }

    .pill{
      font-weight: 850;
      font-size: 11px;
      color: rgba(255,255,255,.80);
      border: 1px solid var(--stroke2);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.03);
      letter-spacing:.02em;
      user-select:none;
      white-space: nowrap;
    }

    .historyRow{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .histItem{
      border-radius: 14px;
      border: 1px solid var(--stroke2);
      background: rgba(255,255,255,.03);
      padding: 10px 8px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 950;
      font-size: clamp(14px, 2vw, 24px);
      min-height: 44px;
      user-select:none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    }

    .histItem.empty{
      color: rgba(255,255,255,.22);
      font-weight: 800;
    }

    /* RIGHT - grid only (no BINGO header) */
    .gridPanel{
      flex: 1;
      min-height: 0;
      display:flex;
      flex-direction:column;
      padding: 12px;
      gap: 10px;
    }

    .grid{
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(15, 1fr);
      gap: var(--gridGap);
    }

    .cell{
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 950;
      font-size: clamp(11px, 1.7vw, 18px);
      color: rgba(255,255,255,.85);
      user-select:none;
      transition: transform .12s ease, background .12s ease, box-shadow .12s ease, border-color .12s ease;
    }

    .cell.called{
      background:
        radial-gradient(800px 400px at 40% 20%, rgba(255,255,255,.18), transparent 65%),
        var(--calledBg);
      color: var(--calledText);
      border-color: rgba(0,0,0,.10);
      box-shadow: 0 14px 26px rgba(0,255,209,.18);
      transform: translateY(-1px);
    }

    /* Confetti canvas overlay */
    #confetti{
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    @media (orientation: portrait){
      .app{ flex-direction:column; }
      .col{ width:100%; height:50%; }
      .partyTitle{ max-width: 100%; }
    }
  </style>
</head>

<body>
  <canvas id="confetti"></canvas>

  <div class="app">

    <!-- LEFT -->
    <section class="col">
      <div class="panel latestPanel">
        <div class="topBar">
          <div class="partyTitle">Azuki's Bingo Party</div>
          <div class="btnRow">
            <button class="btn bingoBtn" id="bingoBtn" title="Celebrate!">Bingo!</button>
            <button class="btn resetBtn" id="resetBtn" title="Clear and start over">Reset</button>
            <button class="btn nextBtn" id="nextBtn">Next →</button>
          </div>
        </div>

        <div class="latestBody">
          <div class="latestBox">
            <div>
              <div class="latestNumber" id="latestNumber">—</div>
              <div class="latestSub" id="latestSub">Press Next to start</div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel historyPanel">
        <div class="titleRow">
          <div class="title">History</div>
          <div class="pill" id="pill">0 / 75 called</div>
        </div>
        <div class="historyRow" id="historyRow"></div>
      </div>
    </section>

    <!-- RIGHT -->
    <section class="col">
      <div class="panel gridPanel">
        <div class="grid" id="grid"></div>
      </div>
    </section>

  </div>

  <script>
    // -------- Japanese number reading (Option 2) --------
    function japaneseNumber(n){
      const ones = ["", "いち", "に", "さん", "よん", "ご", "ろく", "なな", "はち", "きゅう"];
      if (n === 0) return "ゼロ";
      if (n < 10) return ones[n];
      if (n === 10) return "じゅう";

      const tens = Math.floor(n / 10);
      const unit = n % 10;

      const tensRead =
        (tens === 1) ? "じゅう" :
        (tens === 2) ? "にじゅう" :
        (tens === 3) ? "さんじゅう" :
        (tens === 4) ? "よんじゅう" :
        (tens === 5) ? "ごじゅう" :
        (tens === 6) ? "ろくじゅう" :
        (tens === 7) ? "ななじゅう" :
        (tens === 8) ? "はちじゅう" :
        (tens === 9) ? "きゅうじゅう" : "";

      return unit === 0 ? tensRead : (tensRead + ones[unit]);
    }

    // -------- Speech (JP then EN) - number only --------
    function pickVoice(langPrefix){
      const voices = window.speechSynthesis?.getVoices?.() || [];
      let v = voices.find(x => (x.lang || "").toLowerCase().startsWith(langPrefix) && x.localService);
      if (!v) v = voices.find(x => (x.lang || "").toLowerCase().startsWith(langPrefix));
      return v || null;
    }

    function speakNumberBilingual(n){
      const synth = window.speechSynthesis;
      if (!synth || !window.SpeechSynthesisUtterance) return;

      synth.cancel();

      const jp = new SpeechSynthesisUtterance(japaneseNumber(n));
      jp.lang = "ja-JP";
      const jpV = pickVoice("ja");
      if (jpV) jp.voice = jpV;
      jp.rate = 0.95;

      const en = new SpeechSynthesisUtterance(String(n));
      en.lang = "en-US";
      const enV = pickVoice("en");
      if (enV) en.voice = enV;
      en.rate = 0.95;

      jp.onend = () => synth.speak(en);
      synth.speak(jp);
    }

    // -------- UI refs --------
    const gridEl = document.getElementById("grid");
    const historyRowEl = document.getElementById("historyRow");
    const latestNumberEl = document.getElementById("latestNumber");
    const latestSubEl = document.getElementById("latestSub");
    const pillEl = document.getElementById("pill");
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetBtn");
    const bingoBtn = document.getElementById("bingoBtn");

    // Build grid 5 cols x 15 rows: numbers arranged by column (standard bingo layout)
    const cellByNumber = new Map();
    for (let r = 0; r < 15; r++){
      for (let c = 0; c < 5; c++){
        const n = r + 1 + c * 15;
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.textContent = n;
        gridEl.appendChild(cell);
        cellByNumber.set(n, cell);
      }
    }

    function renderHistory(history){
      historyRowEl.innerHTML = "";
      const items = history.slice(0, 5);
      for (let i = 0; i < 5; i++){
        const div = document.createElement("div");
        div.className = "histItem" + (items[i] ? "" : " empty");
        div.textContent = items[i] ? items[i] : "—";
        historyRowEl.appendChild(div);
      }
    }

    // -------- Game state (random unique numbers) --------
    let remaining = [];
    let called = new Set();
    let historyNums = []; // latest-first numbers

    function startNewGame(){
      remaining = Array.from({length:75}, (_, i) => i + 1);
      called = new Set();
      historyNums = [];

      for (let n = 1; n <= 75; n++){
        const cell = cellByNumber.get(n);
        if (cell) cell.classList.remove("called");
      }

      latestNumberEl.textContent = "—";
      latestSubEl.textContent = "Press Next to start";
      renderHistory([]);
      pillEl.textContent = "0 / 75 called";
      nextBtn.disabled = false;

      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function updateCounts(){
      pillEl.textContent = `${called.size} / 75 called`;
    }

    function pickRandomRemaining(){
      const idx = Math.floor(Math.random() * remaining.length);
      const n = remaining[idx];
      remaining[idx] = remaining[remaining.length - 1];
      remaining.pop();
      return n;
    }

    function callNext(){
      if (remaining.length === 0){
        nextBtn.disabled = true;
        latestNumberEl.textContent = "DONE";
        latestSubEl.textContent = "All numbers called";
        return;
      }

      const n = pickRandomRemaining();
      called.add(n);

      // Latest (number only)
      latestNumberEl.textContent = String(n);
      latestSubEl.textContent = `${japaneseNumber(n)}  •  ${n}`;

      // History: show previous 5 (exclude current)
      historyNums.unshift(n);
      const previousFive = historyNums.slice(1, 6).map(String);
      renderHistory(previousFive);

      // Highlight
      const cell = cellByNumber.get(n);
      if (cell) cell.classList.add("called");

      // Speak JP then EN (number only)
      speakNumberBilingual(n);

      updateCounts();

      if (remaining.length === 0) nextBtn.disabled = true;
    }

    // -------- Celebration (Confetti + sparkle + tiny cheer beep) --------
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d", { alpha: true });

    function resizeCanvas(){
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function rand(a,b){ return a + Math.random() * (b-a); }

    function confettiBurst(){
      const W = window.innerWidth;
      const H = window.innerHeight;

      const pieces = [];
      const count = 170;

      for (let i=0; i<count; i++){
        pieces.push({
          x: W * 0.65 + rand(-60, 60),
          y: H * 0.25 + rand(-40, 40),
          vx: rand(-4.2, 4.2),
          vy: rand(-9.5, -2.5),
          g: rand(0.18, 0.32),
          r: rand(3, 6),
          rot: rand(0, Math.PI),
          vr: rand(-0.25, 0.25),
          life: rand(60, 100),
          hue: rand(160, 280) // teal→purple range
        });
      }

      let frame = 0;
      function tick(){
        frame++;
        ctx.clearRect(0,0,W,H);

        for (const p of pieces){
          p.vy += p.g;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          p.life -= 1;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = `hsla(${p.hue}, 95%, 60%, 0.95)`;
          ctx.fillRect(-p.r, -p.r*0.7, p.r*2, p.r*1.4);
          ctx.restore();
        }

        // remove dead
        for (let i=pieces.length-1; i>=0; i--){
          if (pieces[i].life <= 0 || pieces[i].y > H + 60) pieces.splice(i,1);
        }

        if (pieces.length > 0 && frame < 140){
          requestAnimationFrame(tick);
        } else {
          ctx.clearRect(0,0,W,H);
        }
      }
      requestAnimationFrame(tick);
    }

    // Tiny cheer beep using WebAudio (works locally; may still not cast to TV)
    function cheerBeep(){
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ac = new AC();
        const now = ac.currentTime;
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(660, now);
        o.frequency.exponentialRampToValueAtTime(990, now + 0.18);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.14, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
        o.connect(g).connect(ac.destination);
        o.start(now);
        o.stop(now + 0.25);
        setTimeout(()=>ac.close?.(), 400);
      } catch(e){}
    }

    function celebrate(){
      confettiBurst();
      cheerBeep();
      // optional: say "Bingo!" (comment out if you want silence)
      // const u = new SpeechSynthesisUtterance("Bingo!");
      // u.lang = "en-US";
      // window.speechSynthesis?.speak(u);
    }

    // Voices load async in some browsers
    if (window.speechSynthesis){
      window.speechSynthesis.onvoiceschanged = () => {};
    }

    // Init
    startNewGame();

    nextBtn.addEventListener("click", callNext);

    resetBtn.addEventListener("click", () => {
      const ok = confirm("Reset the game and clear all called numbers?");
      if (ok) startNewGame();
    });

    bingoBtn.addEventListener("click", celebrate);

    // Spacebar = Next, B = Bingo
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space"){
        e.preventDefault();
        if (!nextBtn.disabled) callNext();
      } else if (e.key.toLowerCase() === "b"){
        celebrate();
      }
    });
  </script>
</body>
</html>
