<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Azuki's Birthday Party</title>

  <style>
    :root{
      /* Pretty purple background */
      --bgA:#2b0b6d;
      --bgB:#4a1fb8;
      --bgC:#6a2ff0;
      --bgD:#a13bff;

      --glass: rgba(255,255,255,.07);
      --glass2: rgba(255,255,255,.04);
      --stroke: rgba(255,255,255,.14);
      --stroke2: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.94);
      --muted: rgba(255,255,255,.70);

      --accentMint:#00ffd1;
      --accentPink:#ff61d7;
      --accentBlue:#2a7cff;

      --calledBg: rgba(255,97,215,.92); /* bright pink highlight */
      --calledText: #2b0730;

      --shadowSoft: 0 10px 28px rgba(0,0,0,.22);
      --radiusXL: 26px;

      /* TV-friendly, tighter spacing */
      --pagePad: 10px;
      --gap: 10px;
      --pad: 12px;

      /* Grid tight but readable */
      --gridPad: 8px;
      --gridGap: 6px;
    }

    *{ box-sizing: border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      overflow:hidden;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1100px 780px at 18% 18%, rgba(255,97,215,.25), transparent 60%),
        radial-gradient(1000px 700px at 85% 20%, rgba(0,255,209,.18), transparent 55%),
        radial-gradient(1200px 900px at 55% 85%, rgba(42,124,255,.22), transparent 60%),
        linear-gradient(135deg, var(--bgA), var(--bgB) 35%, var(--bgC) 70%, var(--bgD));
    }

    /* sparkly texture */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.22;
      background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,.22) 0 1px, transparent 2px),
        radial-gradient(circle at 30% 40%, rgba(255,255,255,.16) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 25%, rgba(255,255,255,.20) 0 1px, transparent 2px),
        radial-gradient(circle at 90% 55%, rgba(255,255,255,.14) 0 1px, transparent 2px),
        radial-gradient(circle at 40% 85%, rgba(255,255,255,.18) 0 1px, transparent 2px),
        radial-gradient(circle at 75% 80%, rgba(255,255,255,.16) 0 1px, transparent 2px);
      background-size: 420px 420px;
      filter: blur(.2px);
    }

    .app{
      height:100vh;
      display:flex;
      padding: var(--pagePad);
      gap: var(--gap);
    }

    .col{
      width:50%;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap: var(--gap);
    }

    .panel{
      background: linear-gradient(180deg, var(--glass), var(--glass2));
      border: 1px solid var(--stroke);
      border-radius: var(--radiusXL);
      box-shadow: var(--shadowSoft);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow:hidden;
      position: relative;
    }

    .panel::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius: var(--radiusXL);
      pointer-events:none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
    }

    /* Top bar */
    .topBar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 10px 12px;
    }

    .partyTitle{
      font-weight: 1000;
      letter-spacing: .01em;
      font-size: clamp(18px, 2.6vw, 28px); /* bigger title */
      line-height: 1.05;
      user-select:none;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 56%;
      text-shadow: 0 10px 28px rgba(0,0,0,.28);
    }

    .btnRow{
      display:flex;
      gap: 8px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap: wrap;
    }

    .btn{
      border: none;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 950;
      font-size: 14px;
      cursor: pointer;
      color: white;
      user-select:none;
      position: relative;
      overflow:hidden;
      transform: translateZ(0);
      line-height: 1;
      box-shadow: 0 14px 30px rgba(0,0,0,.16);
    }

    .btn::after{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(600px 180px at 20% 0%, rgba(255,255,255,.28), transparent 55%);
      opacity:.55;
      transform: translateY(-22px);
      transition: transform .18s ease;
      pointer-events:none;
    }
    .btn:hover::after{ transform: translateY(-10px); }
    .btn:active{ transform: translateY(1px); }
    .btn:disabled{ cursor:not-allowed; opacity:.55; transform:none; }

    .nextBtn{
      background:
        radial-gradient(120% 140% at 20% 10%, rgba(255,255,255,.20), transparent 45%),
        linear-gradient(135deg, var(--accentBlue), #8a4bff);
    }
    .resetBtn{
      background:
        radial-gradient(120% 140% at 20% 10%, rgba(255,255,255,.16), transparent 45%),
        linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.18);
    }
    .bingoBtn{
      background:
        radial-gradient(120% 140% at 20% 10%, rgba(255,255,255,.22), transparent 45%),
        linear-gradient(135deg, var(--accentMint), var(--accentPink));
      color: #1b0430;
    }

    /* LEFT */
    .latestPanel{
      flex: 1;
      min-height:0;
      display:flex;
      flex-direction:column;
    }

    .latestBody{
      flex:1;
      min-height:0;
      padding: var(--pad);
      display:flex;
    }

    .latestBox{
      flex:1;
      border-radius: 20px;
      border: 1px solid var(--stroke2);
      background:
        radial-gradient(1200px 700px at 30% 20%, rgba(255,97,215,.16), transparent 55%),
        radial-gradient(900px 650px at 70% 80%, rgba(0,255,209,.12), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding: 10px;
      user-select:none;
    }

    .latestNumber{
      font-weight: 1000;
      letter-spacing: .01em;
      line-height: .95;
      font-size: clamp(76px, 13vw, 230px); /* big */
      text-shadow: 0 20px 55px rgba(0,0,0,.38);
    }

    .latestSub{
      margin-top: 8px;
      font-weight: 800;
      color: rgba(255,255,255,.78);
      letter-spacing: .02em;
      font-size: clamp(12px, 1.7vw, 18px);
      line-height: 1.25;
    }

    .historyPanel{
      padding: 10px 12px 12px;
    }

    .titleRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 8px;
      gap: 10px;
    }

    .title{
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 11px;
      color: rgba(255,255,255,.78);
      user-select:none;
    }

    .pill{
      font-weight: 900;
      font-size: 11px;
      color: rgba(255,255,255,.86);
      border: 1px solid rgba(255,255,255,.16);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      white-space: nowrap;
      user-select:none;
    }

    .historyRow{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .histItem{
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04);
      padding: 10px 6px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 1000;
      font-size: clamp(16px, 2.2vw, 28px); /* bigger */
      min-height: 46px;
      user-select:none;
    }
    .histItem.empty{ color: rgba(255,255,255,.25); font-weight: 850; }

    /* RIGHT: grid fills space more */
    .gridPanel{
      flex: 1;
      min-height: 0;
      display:flex;
      flex-direction:column;
      padding: var(--gridPad);
    }

    .grid{
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(15, 1fr);
      gap: var(--gridGap);
    }

    .cell{
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015));
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 1000;
      font-size: clamp(14px, 2.1vw, 24px); /* bigger numbers */
      color: rgba(255,255,255,.90);
      user-select:none;
      transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
    }

    .cell.called{
      background:
        radial-gradient(900px 500px at 40% 20%, rgba(255,255,255,.22), transparent 60%),
        var(--calledBg);
      color: var(--calledText);
      box-shadow: 0 16px 34px rgba(255,97,215,.25);
      transform: translateY(-1px);
    }

    /* Celebration overlay */
    #confetti{
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    .celebrateOverlay{
      position: fixed;
      inset: 0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 1000;
      pointer-events:none;
      background:
        radial-gradient(700px 400px at 50% 40%, rgba(255,255,255,.18), transparent 62%),
        radial-gradient(1000px 700px at 50% 60%, rgba(255,97,215,.18), transparent 60%),
        radial-gradient(900px 600px at 30% 30%, rgba(0,255,209,.14), transparent 60%),
        rgba(10, 0, 30, 0.35);
      backdrop-filter: blur(2px);
    }

    .celebrateCard{
      padding: 26px 30px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.18);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      box-shadow: 0 26px 80px rgba(0,0,0,.40);
      text-align:center;
      transform: scale(.98);
      animation: popIn 520ms cubic-bezier(.2,.9,.2,1) forwards;
    }

    .celebrateBig{
      font-size: clamp(54px, 7vw, 110px);
      font-weight: 1100;
      letter-spacing: .02em;
      line-height: 1;
      text-shadow: 0 22px 70px rgba(0,0,0,.45);
      background: linear-gradient(90deg, var(--accentMint), var(--accentPink), #ffd36a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .celebrateSub{
      margin-top: 10px;
      font-weight: 850;
      font-size: clamp(14px, 2vw, 22px);
      color: rgba(255,255,255,.88);
      letter-spacing: .02em;
    }

    @keyframes popIn{
      0% { transform: scale(.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @media (orientation: portrait){
      .app{ flex-direction:column; }
      .col{ width:100%; height:50%; }
      .partyTitle{ max-width: 100%; }
    }
  </style>
</head>

<body>
  <canvas id="confetti"></canvas>

  <div class="celebrateOverlay" id="celebrateOverlay">
    <div class="celebrateCard">
      <div class="celebrateBig">BINGO!</div>
      <div class="celebrateSub">🎉 Azuki’s Birthday Win! 🎉</div>
    </div>
  </div>

  <div class="app">

    <!-- LEFT -->
    <section class="col">
      <div class="panel latestPanel">
        <div class="topBar">
          <div class="partyTitle">Azuki's Birthday Party</div>
          <div class="btnRow">
            <button class="btn bingoBtn" id="bingoBtn" title="Celebrate!">Bingo!</button>
            <button class="btn resetBtn" id="resetBtn" title="Clear and start over">Reset</button>
            <button class="btn nextBtn" id="nextBtn">Next →</button>
          </div>
        </div>

        <div class="latestBody">
          <div class="latestBox">
            <div>
              <div class="latestNumber" id="latestNumber">—</div>
              <div class="latestSub" id="latestSub">Press Next to start</div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel historyPanel">
        <div class="titleRow">
          <div class="title">History</div>
          <div class="pill" id="pill">0 / 75 called</div>
        </div>
        <div class="historyRow" id="historyRow"></div>
      </div>
    </section>

    <!-- RIGHT -->
    <section class="col">
      <div class="panel gridPanel">
        <div class="grid" id="grid"></div>
      </div>
    </section>

  </div>

  <script>
    // ---------------- Japanese number reading ----------------
    function japaneseNumber(n){
      const ones = ["", "いち", "に", "さん", "よん", "ご", "ろく", "なな", "はち", "きゅう"];
      if (n === 0) return "ゼロ";
      if (n < 10) return ones[n];
      if (n === 10) return "じゅう";

      const tens = Math.floor(n / 10);
      const unit = n % 10;

      const tensRead =
        (tens === 1) ? "じゅう" :
        (tens === 2) ? "にじゅう" :
        (tens === 3) ? "さんじゅう" :
        (tens === 4) ? "よんじゅう" :
        (tens === 5) ? "ごじゅう" :
        (tens === 6) ? "ろくじゅう" :
        (tens === 7) ? "ななじゅう" :
        (tens === 8) ? "はちじゅう" :
        (tens === 9) ? "きゅうじゅう" : "";

      return unit === 0 ? tensRead : (tensRead + ones[unit]);
    }

    // ---------------- Cute voice selection ----------------
    function pickCuteVoice(langPrefix){
      const voices = window.speechSynthesis?.getVoices?.() || [];
      const prefix = langPrefix.toLowerCase();

      // Keywords that often correlate with friendlier/female-ish voices (varies by OS/browser)
      const cuteHints = [
        "female","woman","girl","samantha","victoria","zoe","serena","karen",
        "siri","enhanced",
        "nanami","mizuki","haruka","hinata","yuna","kyoko","ayumi"
      ];

      const candidates = voices.filter(v => (v.lang || "").toLowerCase().startsWith(prefix));
      if (!candidates.length) return null;

      // Prefer local voices first
      const local = candidates.filter(v => v.localService);

      function score(v){
        const name = (v.name || "").toLowerCase();
        let s = 0;
        if (v.localService) s += 3;
        if (cuteHints.some(k => name.includes(k))) s += 5;
        // Some Google voices are pleasant too
        if (name.includes("google")) s += 1;
        return s;
      }

      const pool = local.length ? local : candidates;
      pool.sort((a,b) => score(b) - score(a));
      return pool[0] || null;
    }

    function speakCuteBilingualNumber(n){
      const synth = window.speechSynthesis;
      if (!synth || !window.SpeechSynthesisUtterance) return;

      synth.cancel();

      const jp = new SpeechSynthesisUtterance(japaneseNumber(n));
      jp.lang = "ja-JP";
      const jpV = pickCuteVoice("ja");
      if (jpV) jp.voice = jpV;
      jp.rate = 1.02;
      jp.pitch = 1.35;   // cuter / higher
      jp.volume = 1.0;

      const en = new SpeechSynthesisUtterance(String(n));
      en.lang = "en-US";
      const enV = pickCuteVoice("en");
      if (enV) en.voice = enV;
      en.rate = 1.02;
      en.pitch = 1.28;
      en.volume = 1.0;

      jp.onend = () => synth.speak(en);
      synth.speak(jp);
    }

    function speakCuteBingo(){
      const synth = window.speechSynthesis;
      if (!synth || !window.SpeechSynthesisUtterance) return;

      synth.cancel();
      const u = new SpeechSynthesisUtterance("Bingo!");
      u.lang = "en-US";
      const v = pickCuteVoice("en");
      if (v) u.voice = v;
      u.rate = 1.05;
      u.pitch = 1.45; // extra cute for Bingo
      u.volume = 1.0;
      synth.speak(u);
    }

    // ---------------- UI refs ----------------
    const gridEl = document.getElementById("grid");
    const historyRowEl = document.getElementById("historyRow");
    const latestNumberEl = document.getElementById("latestNumber");
    const latestSubEl = document.getElementById("latestSub");
    const pillEl = document.getElementById("pill");
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetBtn");
    const bingoBtn = document.getElementById("bingoBtn");

    const overlay = document.getElementById("celebrateOverlay");

    // Build standard bingo grid layout by columns (1–15, 16–30, ...)
    const cellByNumber = new Map();
    for (let r = 0; r < 15; r++){
      for (let c = 0; c < 5; c++){
        const num = r + 1 + c * 15;
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.textContent = num;
        gridEl.appendChild(cell);
        cellByNumber.set(num, cell);
      }
    }

    function renderHistory(history){
      historyRowEl.innerHTML = "";
      const items = history.slice(0, 5);
      for (let i = 0; i < 5; i++){
        const div = document.createElement("div");
        div.className = "histItem" + (items[i] ? "" : " empty");
        div.textContent = items[i] ? items[i] : "—";
        historyRowEl.appendChild(div);
      }
    }

    // ---------------- Game state ----------------
    let remaining = [];
    let called = new Set();
    let historyNums = []; // latest-first

    function startNewGame(){
      remaining = Array.from({length:75}, (_, i) => i + 1);
      called = new Set();
      historyNums = [];

      for (let n = 1; n <= 75; n++){
        const cell = cellByNumber.get(n);
        if (cell) cell.classList.remove("called");
      }

      latestNumberEl.textContent = "—";
      latestSubEl.textContent = "Press Next to start";
      renderHistory([]);
      pillEl.textContent = "0 / 75 called";
      nextBtn.disabled = false;

      overlay.style.display = "none";
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function updateCounts(){
      pillEl.textContent = `${called.size} / 75 called`;
    }

    function pickRandomRemaining(){
      const idx = Math.floor(Math.random() * remaining.length);
      const n = remaining[idx];
      remaining[idx] = remaining[remaining.length - 1];
      remaining.pop();
      return n;
    }

    function callNext(){
      if (remaining.length === 0){
        nextBtn.disabled = true;
        latestNumberEl.textContent = "DONE";
        latestSubEl.textContent = "All numbers called";
        return;
      }

      const n = pickRandomRemaining();
      called.add(n);

      latestNumberEl.textContent = String(n);
      latestSubEl.textContent = `${japaneseNumber(n)}  •  ${n}`;

      historyNums.unshift(n);
      const previousFive = historyNums.slice(1, 6).map(String);
      renderHistory(previousFive);

      const cell = cellByNumber.get(n);
      if (cell) cell.classList.add("called");

      speakCuteBilingualNumber(n);
      updateCounts();

      if (remaining.length === 0) nextBtn.disabled = true;
    }

    // ---------------- Fancy celebration ----------------
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d", { alpha: true });

    function resizeCanvas(){
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function rand(a,b){ return a + Math.random()*(b-a); }

    function fancyBurst(){
      const W = window.innerWidth;
      const H = window.innerHeight;

      const particles = [];
      const bursts = 3;
      const colors = [
        {h: 310, s: 95, l: 62}, // pink
        {h: 185, s: 95, l: 55}, // mint
        {h: 260, s: 95, l: 65}, // purple
        {h: 45,  s: 95, l: 62}, // gold
      ];

      for (let b=0; b<bursts; b++){
        const cx = W * rand(0.25, 0.75);
        const cy = H * rand(0.20, 0.50);
        const count = 190;

        for (let i=0; i<count; i++){
          const c = colors[Math.floor(rand(0, colors.length))];
          const ang = rand(0, Math.PI*2);
          const spd = rand(2.0, 9.5);
          particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(ang)*spd,
            vy: Math.sin(ang)*spd - rand(2, 6),
            g: rand(0.08, 0.20),
            size: rand(3, 7),
            rot: rand(0, Math.PI),
            vr: rand(-0.25, 0.25),
            life: rand(70, 140),
            type: Math.random() < 0.25 ? "star" : "rect",
            c
          });
        }
      }

      // Sparkle rings
      const rings = [];
      for (let i=0; i<3; i++){
        rings.push({ t:0, x: W*0.5, y: H*0.42 + i*15, r: 30 + i*12 });
      }

      let frame = 0;
      function tick(){
        frame++;
        ctx.clearRect(0,0,W,H);

        // rings
        for (const r of rings){
          r.t += 1;
          const rr = r.r + r.t*3.2;
          const alpha = Math.max(0, 0.22 - r.t*0.004);
          ctx.beginPath();
          ctx.arc(r.x, r.y, rr, 0, Math.PI*2);
          ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        for (const p of particles){
          p.vy += p.g;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          p.life -= 1;

          const a = Math.max(0, Math.min(1, p.life / 120));
          const {h,s,l} = p.c;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);

          if (p.type === "star"){
            ctx.fillStyle = `hsla(${h},${s}%,${l}%,${0.95*a})`;
            // simple 5-point star
            ctx.beginPath();
            const spikes = 5, outer = p.size*1.2, inner = p.size*0.55;
            let rot = Math.PI / 2 * 3;
            let x = 0, y = 0;
            ctx.moveTo(0, -outer);
            for (let i = 0; i < spikes; i++){
              x = Math.cos(rot) * outer; y = Math.sin(rot) * outer; ctx.lineTo(x, y); rot += Math.PI / spikes;
              x = Math.cos(rot) * inner; y = Math.sin(rot) * inner; ctx.lineTo(x, y); rot += Math.PI / spikes;
            }
            ctx.closePath();
            ctx.fill();
          } else {
            ctx.fillStyle = `hsla(${h},${s}%,${l}%,${0.95*a})`;
            ctx.fillRect(-p.size, -p.size*0.7, p.size*2, p.size*1.4);
          }

          ctx.restore();
        }

        // cull
        for (let i=particles.length-1; i>=0; i--){
          if (particles[i].life <= 0 || particles[i].y > H + 80) particles.splice(i,1);
        }

        if (particles.length > 0 && frame < 200){
          requestAnimationFrame(tick);
        } else {
          ctx.clearRect(0,0,W,H);
        }
      }
      requestAnimationFrame(tick);
    }

    function celebrate(){
      overlay.style.display = "flex";
      fancyBurst();
      speakCuteBingo();

      // auto-hide overlay after a moment
      setTimeout(() => { overlay.style.display = "none"; }, 1800);
    }

    // voices load async
    if (window.speechSynthesis){
      window.speechSynthesis.onvoiceschanged = () => {};
    }

    // Init
    startNewGame();

    nextBtn.addEventListener("click", callNext);

    resetBtn.addEventListener("click", () => {
      const ok = confirm("Reset the game and clear all called numbers?");
      if (ok) startNewGame();
    });

    bingoBtn.addEventListener("click", celebrate);

    // Keyboard: Space = Next, B = Bingo
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space"){
        e.preventDefault();
        if (!nextBtn.disabled) callNext();
      } else if (e.key.toLowerCase() === "b"){
        celebrate();
      }
    });
  </script>
</body>
</html>
