<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aki's Birthday Party</title>

  <style>
    :root{
      /* Purple + pretty */
      --bg0:#120523;
      --bg1:#2a0f5a;
      --bg2:#5a1ea8;

      --glass: rgba(255,255,255,.07);
      --glass2: rgba(255,255,255,.04);
      --stroke: rgba(255,255,255,.14);
      --stroke2: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.93);
      --muted: rgba(255,255,255,.68);

      --accentA:#ff7ad9; /* pink */
      --accentB:#8f6bff; /* purple */
      --accentC:#43d6ff; /* sky */

      --calledBg: rgba(255,122,217,.92);
      --calledText: #2b0630;

      --shadowSoft: 0 10px 26px rgba(0,0,0,.28);
      --radiusXL: 26px;

      /* Tight layout (TV-safe) */
      --pagePad: 10px;
      --gap: 10px;
      --pad: 12px;

      --gridPad: 8px;     /* smaller padding so grid uses space */
      --gridGap: 6px;     /* smaller gaps */

      /* EXTRA bottom safe margin for overscan */
      --safeBottom: 48px;
    }

    *{ box-sizing: border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      overflow:hidden;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1100px 700px at 20% 25%, rgba(255,122,217,.22), transparent 60%),
        radial-gradient(1000px 700px at 75% 35%, rgba(67,214,255,.18), transparent 55%),
        radial-gradient(1200px 900px at 55% 90%, rgba(143,107,255,.22), transparent 62%),
        linear-gradient(180deg, var(--bg2), var(--bg0));
    }

    /* glitter */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.22;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.22) 0 1px, transparent 2px),
        radial-gradient(circle at 38% 30%, rgba(255,255,255,.16) 0 1px, transparent 2px),
        radial-gradient(circle at 62% 22%, rgba(255,255,255,.18) 0 1px, transparent 2px),
        radial-gradient(circle at 85% 34%, rgba(255,255,255,.16) 0 1px, transparent 2px),
        radial-gradient(circle at 22% 78%, rgba(255,255,255,.12) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 72%, rgba(255,255,255,.13) 0 1px, transparent 2px);
      background-size: 420px 420px;
      filter: blur(.2px);
    }

    .app{
      height:100vh;
      display:flex;
      padding: var(--pagePad);
      padding-bottom: calc(var(--pagePad) + var(--safeBottom)); /* <<< overscan safe */
      gap: var(--gap);
    }

    .col{
      width:50%;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap: var(--gap);
    }

    .panel{
      background: linear-gradient(180deg, var(--glass), var(--glass2));
      border: 1px solid var(--stroke);
      border-radius: var(--radiusXL);
      box-shadow: var(--shadowSoft);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow:hidden;
      position: relative;
    }
    .panel::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius: var(--radiusXL);
      pointer-events:none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    }

    /* Top bar: bigger title, buttons top-right */
    .topBar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 10px 12px;
    }

    .partyTitle{
      font-weight: 1000;
      letter-spacing: .01em;
      font-size: clamp(18px, 2.6vw, 28px);
      line-height: 1.2;
      user-select:none;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 58%;
      text-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    .btnRow{
      display:flex;
      gap: 8px;
      align-items:center;
      justify-content:flex-end;
      flex-wrap: wrap;
    }

    .btn{
      border: none;
      border-radius: 14px;
      padding: 10px 12px;
      font-weight: 950;
      font-size: 14px;
      cursor: pointer;
      color: white;
      user-select:none;
      position: relative;
      overflow:hidden;
      transform: translateZ(0);
      line-height: 1;
      box-shadow: 0 14px 28px rgba(0,0,0,.18);
    }

    .btn::after{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(600px 180px at 20% 0%, rgba(255,255,255,.25), transparent 55%);
      opacity:.55;
      transform: translateY(-22px);
      transition: transform .18s ease;
      pointer-events:none;
    }
    .btn:hover::after{ transform: translateY(-10px); }
    .btn:active{ transform: translateY(1px); }
    .btn:disabled{ cursor:not-allowed; opacity:.55; transform:none; }

    .nextBtn{
      background:
        radial-gradient(120% 140% at 20% 10%, rgba(255,255,255,.18), transparent 45%),
        linear-gradient(135deg, var(--accentC), var(--accentB));
    }
    .resetBtn{
      background:
        radial-gradient(120% 140% at 20% 10%, rgba(255,255,255,.14), transparent 45%),
        linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.16);
    }
    .bingoBtn{
      background:
        radial-gradient(120% 140% at 20% 10%, rgba(255,255,255,.20), transparent 45%),
        linear-gradient(135deg, rgba(255,122,217,.98), rgba(143,107,255,.75));
    }

    /* LEFT */
    .latestPanel{ flex: 1; min-height:0; display:flex; flex-direction:column; }

    .latestBody{
      flex:1; min-height:0;
      padding: var(--pad);
      display:flex;
    }

    .latestBox{
      flex:1;
      perspective: 1400px;
      user-select:none;
      display: flex;
    }

    .flipCardInner{
      flex:1;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 20px;
    }

    .flipCardInner.flipped{
      transform: rotateY(180deg);
    }

    .flipCardFront,
    .flipCardBack{
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .flipCardFront{
      border: 1px solid var(--stroke2);
      background:
        radial-gradient(1200px 700px at 25% 15%, rgba(255,122,217,.18), transparent 58%),
        radial-gradient(900px 650px at 70% 80%, rgba(67,214,255,.14), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      padding: 10px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    .flipCardBack{
      transform: rotateY(180deg);
      overflow: hidden;
      border: 1px solid var(--stroke2);
      background: #000;
    }

    .flipCardBack img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      display: block;
    }

    .latestNumber{
      font-weight: 1000;
      letter-spacing: .01em;
      line-height: .95;
      font-size: clamp(78px, 13vw, 240px);
      text-shadow: 0 18px 45px rgba(0,0,0,.40);
    }

    .latestSub{
      margin-top: 10px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: .02em;
      font-size: clamp(12px, 1.8vw, 18px);
      line-height: 1.25;
    }

    .historyPanel{
      padding: 10px 12px 12px;
    }

    .titleRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 8px;
      gap: 10px;
    }

    .title{
      font-weight: 950;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 11px;
      color: rgba(255,255,255,.75);
      user-select:none;
    }

    .pill{
      font-weight: 900;
      font-size: 11px;
      color: rgba(255,255,255,.82);
      border: 1px solid var(--stroke2);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.03);
      user-select:none;
      white-space: nowrap;
    }

    .historyRow{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .histItem{
      border-radius: 14px;
      border: 1px solid var(--stroke2);
      background: rgba(255,255,255,.03);
      padding: 10px 8px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 1000;
      font-size: clamp(16px, 2.3vw, 28px);
      min-height: 44px;
      user-select:none;
    }

    .histItem.empty{ color: rgba(255,255,255,.22); font-weight: 850; }

    .histItem.latest{
      background:
        radial-gradient(800px 400px at 40% 20%, rgba(255,255,255,.22), transparent 65%),
        var(--calledBg);
      color: var(--calledText);
      box-shadow: 0 10px 24px rgba(255,122,217,.28);
      transform: scale(1.08);
      border-color: rgba(255,122,217,.55);
    }

    /* RIGHT - tighter padding, bigger numbers, smaller gaps */
    .gridPanel{
      flex: 1;
      min-height: 0;
      display:flex;
      flex-direction:column;
      padding: var(--gridPad);
    }

    .grid{
      flex:1;
      min-height:0;
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(15, 1fr);
      gap: var(--gridGap);
    }

    .cell{
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 1000;
      font-size: clamp(14px, 2.4vw, 26px);
      color: rgba(255,255,255,.90);
      user-select:none;
      transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
    }

    .cell.called{
      background:
        radial-gradient(800px 400px at 40% 20%, rgba(255,255,255,.22), transparent 65%),
        var(--calledBg);
      color: var(--calledText);
      box-shadow: 0 16px 30px rgba(255,122,217,.18);
      transform: translateY(-1px);
    }

    /* Celebration overlays */
    #fxCanvas{
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1002;
    }

    .bingoOverlay{
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
      display:flex;
      align-items:center;
      justify-content:center;
      opacity: 0;
      transform: scale(0.98);
      transition: opacity .20s ease, transform .20s ease;
      background:
        radial-gradient(900px 600px at 50% 45%, rgba(255,255,255,.08), transparent 65%),
        radial-gradient(1200px 900px at 50% 50%, rgba(255,122,217,.20), transparent 62%),
        radial-gradient(1200px 900px at 50% 55%, rgba(143,107,255,.22), transparent 62%);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    .bingoOverlay.show{
      opacity: 1;
      transform: scale(1);
    }

    .bingoText{
      font-weight: 1100;
      font-size: clamp(64px, 10vw, 160px);
      letter-spacing: .08em;
      text-transform: uppercase;
      text-shadow:
        0 24px 60px rgba(0,0,0,.45),
        0 0 30px rgba(255,122,217,.35);
      color: rgba(255,255,255,.95);
      padding: 18px 26px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.18);
      background: linear-gradient(135deg, rgba(255,122,217,.22), rgba(67,214,255,.14));
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
    }

    .bingoVideoOverlay{
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      cursor: pointer;
    }

    .bingoVideoOverlay.show{
      opacity: 1;
      pointer-events: auto;
    }

    .bingoVideoOverlay video{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Floating emojis */
    .floatEmoji{
      position: fixed;
      pointer-events: none;
      z-index: 1001;
      font-size: 28px;
      line-height: 1;
      will-change: transform, opacity;
      animation: floatUp var(--dur, 2.2s) cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }

    @keyframes floatUp{
      0%   { transform: translate(0, 0) scale(.6) rotate(var(--r0,0deg)); opacity: 0; }
      12%  { opacity: 1; }
      60%  { opacity: .88; }
      100% { transform: translate(var(--dx,0px), var(--dy,-180px)) scale(1.1) rotate(var(--r1,20deg)); opacity: 0; }
    }

    @media (orientation: portrait){
      .app{ flex-direction:column; }
      .col{ width:100%; height:50%; }
      .partyTitle{ max-width: 100%; }
    }
  </style>
</head>

<body>
  <canvas id="fxCanvas"></canvas>
  <div class="bingoOverlay" id="bingoOverlay">
    <div class="bingoText">BINGO!</div>
  </div>

  <div class="bingoVideoOverlay" id="bingoVideoOverlay">
    <video id="bingoVideo" src="public/aki/aki_bingo.mp4" playsinline></video>
  </div>

  <div class="app">
    <!-- LEFT -->
    <section class="col">
      <div class="panel latestPanel">
        <div class="topBar">
          <div class="partyTitle">Aki's Birthday Party</div>
          <div class="btnRow">
            <button class="btn bingoBtn" id="bingoBtn" title="Celebrate!">Bingo!</button>
            <button class="btn resetBtn" id="resetBtn" title="Clear and start over">Reset</button>
            <button class="btn nextBtn" id="nextBtn">Next →</button>
          </div>
        </div>

        <div class="latestBody">
          <div class="latestBox">
            <div class="flipCardInner" id="flipCardInner">
              <div class="flipCardFront">
                <div>
                  <div class="latestNumber" id="latestNumber">—</div>
                  <div class="latestSub" id="latestSub">Press Next to start</div>
                </div>
              </div>
              <div class="flipCardBack">
                <img id="latestImage" src="" alt="" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel historyPanel">
        <div class="titleRow">
          <div class="title">History</div>
          <div class="pill" id="pill">0 / 75 called</div>
        </div>
        <div class="historyRow" id="historyRow"></div>
      </div>
    </section>

    <!-- RIGHT -->
    <section class="col">
      <div class="panel gridPanel">
        <div class="grid" id="grid"></div>
      </div>
    </section>
  </div>

  <script>
    // ---------- Japanese number reading (more natural TTS) ----------
    // Adds a slight pause between tens and ones (e.g., "にじゅう いち") which many TTS engines read more naturally.
    function japaneseNumber(n){
      const ones = ["", "いち", "に", "さん", "よん", "ご", "ろく", "なな", "はち", "きゅう"];
      if (n === 0) return "ゼロ";
      if (n < 10) return ones[n];
      if (n === 10) return "じゅう";

      const tens = Math.floor(n / 10);
      const unit = n % 10;

      const tensRead =
        (tens === 1) ? "じゅう" :
        (tens === 2) ? "にじゅう" :
        (tens === 3) ? "さんじゅう" :
        (tens === 4) ? "よんじゅう" :
        (tens === 5) ? "ごじゅう" :
        (tens === 6) ? "ろくじゅう" :
        (tens === 7) ? "ななじゅう" :
        (tens === 8) ? "はちじゅう" :
        (tens === 9) ? "きゅうじゅう" : "";

      if (unit === 0) return tensRead;

      // the key change: add a small pause
      return tensRead + " " + ones[unit];
    }

    // ---------- “Cute voice” selection (best effort) ----------
    const CUTE_HINTS_EN = ["Samantha","Victoria","Karen","Moira","Tessa","Fiona","Ava","Serena","Google US English"];
    const CUTE_HINTS_JA = ["Kyoko","O-Ren","Google 日本語","Google Japanese","Mizuki","Haruka","Hina","Yui"];

    function getVoices(){
      return window.speechSynthesis?.getVoices?.() || [];
    }

    function pickCuteVoice(langPrefix, hints){
      const voices = getVoices();
      const candidates = voices.filter(v => (v.lang || "").toLowerCase().startsWith(langPrefix));

      for (const hint of hints){
        const m = candidates.find(v => (v.name || "").toLowerCase().includes(hint.toLowerCase()));
        if (m) return m;
      }

      const local = candidates.find(v => v.localService);
      if (local) return local;

      return candidates[0] || null;
    }

    function speakCuteJPThenEN_Number(n){
      const synth = window.speechSynthesis;
      if (!synth || !window.SpeechSynthesisUtterance) return;

      synth.cancel();

      const jpVoice = pickCuteVoice("ja", CUTE_HINTS_JA);
      const enVoice = pickCuteVoice("en", CUTE_HINTS_EN);

      const jp = new SpeechSynthesisUtterance(japaneseNumber(n));
      jp.lang = "ja-JP";
      if (jpVoice) jp.voice = jpVoice;
      jp.rate = 0.98;
      jp.pitch = 1.20;

      const en = new SpeechSynthesisUtterance(String(n));
      en.lang = "en-US";
      if (enVoice) en.voice = enVoice;
      en.rate = 0.98;
      en.pitch = 1.15;

      jp.onend = () => synth.speak(en);
      synth.speak(jp);
    }

    // Ensure voices load in some browsers
    if (window.speechSynthesis){
      window.speechSynthesis.onvoiceschanged = () => {};
    }

    // ---------- UI refs ----------
    const gridEl = document.getElementById("grid");
    const historyRowEl = document.getElementById("historyRow");
    const latestNumberEl = document.getElementById("latestNumber");
    const latestSubEl = document.getElementById("latestSub");
    const pillEl = document.getElementById("pill");
    const nextBtn = document.getElementById("nextBtn");
    const resetBtn = document.getElementById("resetBtn");
    const bingoBtn = document.getElementById("bingoBtn");
    const bingoOverlay = document.getElementById("bingoOverlay");
    const flipCardInner = document.getElementById("flipCardInner");
    const latestImageEl = document.getElementById("latestImage");
    const bingoVideoOverlay = document.getElementById("bingoVideoOverlay");
    const bingoVideoEl = document.getElementById("bingoVideo");

    // Build grid 5 cols x 15 rows (standard bingo layout)
    const cellByNumber = new Map();
    for (let r = 0; r < 15; r++){
      for (let c = 0; c < 5; c++){
        const n = r + 1 + c * 15;
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.textContent = n;
        gridEl.appendChild(cell);
        cellByNumber.set(n, cell);
      }
    }

    function renderHistory(history){
      historyRowEl.innerHTML = "";
      const items = history.slice(0, 5);
      for (let i = 0; i < 5; i++){
        const div = document.createElement("div");
        div.className = "histItem" + (items[i] ? "" : " empty") + (i === 0 && items[i] ? " latest" : "");
        div.textContent = items[i] ? items[i] : "—";
        historyRowEl.appendChild(div);
      }
    }

    // ---------- Game state (random unique numbers) ----------
    let remaining = [];
    let called = new Set();
    let historyNums = []; // latest-first

    function startNewGame(){
      remaining = Array.from({length:75}, (_, i) => i + 1);
      called = new Set();
      historyNums = [];

      for (let n = 1; n <= 75; n++){
        const cell = cellByNumber.get(n);
        if (cell) cell.classList.remove("called");
      }

      // Reset flip card to front face
      flipCardInner.style.transition = "none";
      flipCardInner.classList.remove("flipped");
      flipCardInner.offsetHeight; // force reflow
      flipCardInner.style.transition = "";

      latestNumberEl.textContent = "—";
      latestSubEl.textContent = "Press Next to start";
      renderHistory([]);
      pillEl.textContent = "0 / 75 called";
      nextBtn.disabled = false;

      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function updateCounts(){
      pillEl.textContent = `${called.size} / 75 called`;
    }

    function pickRandomRemaining(){
      const idx = Math.floor(Math.random() * remaining.length);
      const n = remaining[idx];
      remaining[idx] = remaining[remaining.length - 1];
      remaining.pop();
      return n;
    }

    function callNext(){
      if (remaining.length === 0){
        nextBtn.disabled = true;
        latestNumberEl.textContent = "DONE";
        latestSubEl.textContent = "All numbers called";
        return;
      }

      const n = pickRandomRemaining();
      called.add(n);

      // Snap card back to front instantly
      flipCardInner.style.transition = "none";
      flipCardInner.classList.remove("flipped");
      flipCardInner.offsetHeight; // force reflow
      flipCardInner.style.transition = "";

      // Update front content
      latestNumberEl.textContent = String(n);
      latestSubEl.textContent = `${japaneseNumber(n)}  •  ${n}`;

      // Set back-face image (1–64 cycling)
      latestImageEl.src = `public/aki/${((n - 1) % 64) + 1}.jpg`;

      historyNums.unshift(n);
      const previousFive = historyNums.slice(0, 5).map(String);
      renderHistory(previousFive);

      const cell = cellByNumber.get(n);
      if (cell) cell.classList.add("called");

      // Speak number (JP then EN)
      speakCuteJPThenEN_Number(n);

      updateCounts();

      if (remaining.length === 0) nextBtn.disabled = true;

      // Flip to reveal image after a short delay
      setTimeout(() => {
        flipCardInner.classList.add("flipped");
        spawnEmojis();
      }, 800);
    }

    // ---------- Floating emoji burst on flip ----------
    const FLIP_EMOJIS = ["🌸","💖","✨","🎀","🌷","💕","🦋","🍭","💫","🌺","💝","🎶","🌙","⭐","🩷","🫧","🍬","🪷"];

    function spawnEmojis(){
      const W = window.innerWidth;
      const H = window.innerHeight;
      const count = 28;

      for (let i = 0; i < count; i++){
        const el = document.createElement("span");
        el.className = "floatEmoji";
        el.textContent = FLIP_EMOJIS[Math.floor(Math.random() * FLIP_EMOJIS.length)];

        // Random start anywhere on the page
        const startX = Math.random() * W;
        const startY = Math.random() * H;
        const dx = (Math.random() - 0.5) * 300;
        const dy = -(120 + Math.random() * 260);
        const r0 = (Math.random() * 40 - 20) + "deg";
        const r1 = (Math.random() * 90 - 45) + "deg";
        const dur = (3 + Math.random() * 2).toFixed(2) + "s";
        const delay = (Math.random() * 0.8).toFixed(2) + "s";
        const size = (22 + Math.random() * 20).toFixed(0) + "px";

        el.style.cssText = `left:${startX}px; top:${startY}px; font-size:${size}; --dx:${dx}px; --dy:${dy}px; --r0:${r0}; --r1:${r1}; --dur:${dur}; animation-delay:${delay};`;

        document.body.appendChild(el);
        el.addEventListener("animationend", () => el.remove(), { once: true });
      }
    }

    // ---------- Celebration (fancy fullscreen confetti) ----------
    const canvas = document.getElementById("fxCanvas");
    const ctx = canvas.getContext("2d", { alpha: true });

    function resizeCanvas(){
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function rand(a,b){ return a + Math.random() * (b-a); }

    function confettiBurst(){
      const W = window.innerWidth;
      const H = window.innerHeight;

      const pieces = [];
      const count = 240;

      for (let i=0; i<count; i++){
        pieces.push({
          x: rand(W*0.2, W*0.8),
          y: rand(H*0.15, H*0.45),
          vx: rand(-5.4, 5.4),
          vy: rand(-12.0, -3.0),
          g: rand(0.20, 0.36),
          w: rand(4, 8),
          h: rand(3, 6),
          rot: rand(0, Math.PI),
          vr: rand(-0.35, 0.35),
          life: rand(70, 120),
          hue: rand(270, 340), // purple → pink range
          sat: rand(85, 100),
          lum: rand(55, 70)
        });
      }

      let frame = 0;
      function tick(){
        frame++;
        ctx.clearRect(0,0,W,H);

        for (const p of pieces){
          p.vy += p.g;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          p.life -= 1;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.lum}%, 0.95)`;
          ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
          ctx.restore();
        }

        for (let i=pieces.length-1; i>=0; i--){
          if (pieces[i].life <= 0 || pieces[i].y > H + 80) pieces.splice(i,1);
        }

        if (pieces.length > 0 && frame < 160){
          requestAnimationFrame(tick);
        } else {
          ctx.clearRect(0,0,W,H);
        }
      }
      requestAnimationFrame(tick);
    }

    async function celebrate(){
      confettiBurst();
      bingoVideoOverlay.classList.add("show");
      bingoVideoEl.currentTime = 0;
      try {
        await bingoVideoEl.play();
      } catch(e) {
        console.warn("Bingo video play blocked:", e);
      }
    }

    // Dismiss bingo video on click or when it ends
    bingoVideoOverlay.addEventListener("click", () => {
      bingoVideoEl.pause();
      bingoVideoOverlay.classList.remove("show");
    });
    bingoVideoEl.addEventListener("ended", () => {
      bingoVideoOverlay.classList.remove("show");
    });

    // Init
    startNewGame();

    nextBtn.addEventListener("click", callNext);

    resetBtn.addEventListener("click", () => {
      const ok = confirm("Reset the game and clear all called numbers?");
      if (ok) startNewGame();
    });

    bingoBtn.addEventListener("click", celebrate);

    // Spacebar = Next, B = Bingo
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space"){
        e.preventDefault();
        if (!nextBtn.disabled) callNext();
      } else if (e.key.toLowerCase() === "b"){
        celebrate();
      }
    });
  </script>
</body>
</html>
